[program:api]
command=/app/bin/api_get_gp_n_status
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=LD_LIBRARY_PATH="/app/lib"

; ---------------------------------------------------------------------------
; Paris (paris) - service 1
; ---------------------------------------------------------------------------
[program:record_worker_paris]
command=/app/bin/stream_record_worker paris
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=LD_LIBRARY_PATH="/app/lib",CMS_SERVICE="paris"

[program:geo_worker_paris]
command=/app/bin/stream_geo_worker paris ./data/backup/paris
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=LD_LIBRARY_PATH="/app/lib",CMS_SERVICE="paris",CMS_GRAPH_PATH="./data/backup/paris"

